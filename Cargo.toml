[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/decode",
    "crates/engine",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Internal workspace crates
rune-editor-core = { path = "crates/core" }
rune-editor-decode = { path = "crates/decode" }
rune-editor-engine = { path = "crates/engine" }

# Rune by Anomaly (pinned dev revision)
rune = { git = "https://github.com/anomalyco/rune", rev = "0d2cad27f83747120156c8406f6ecfd2a018bd39", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "0d2cad27f83747120156c8406f6ecfd2a018bd39" }

# GPU & Imaging dependencies aligned with Rune's workspace
wgpu = { version = "~30.0.1", default-features = false }
bytemuck = { version = "1.25", features = ["derive"] }
half = { version = "2", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Required by anomalyco/rune: Cargo does not inherit [patch.crates-io] from dependencies.
# Keep every patch pinned to the exact same Rune rev above.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "0d2cad27f83747120156c8406f6ecfd2a018bd39" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "0d2cad27f83747120156c8406f6ecfd2a018bd39" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "0d2cad27f83747120156c8406f6ecfd2a018bd39" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "0d2cad27f83747120156c8406f6ecfd2a018bd39" }
naga = { git = "https://github.com/anomalyco/rune", rev = "0d2cad27f83747120156c8406f6ecfd2a018bd39" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "0d2cad27f83747120156c8406f6ecfd2a018bd39" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "0d2cad27f83747120156c8406f6ecfd2a018bd39" }
accesskit_atspi_common = { git = "https://github.com/anomalyco/rune", rev = "0d2cad27f83747120156c8406f6ecfd2a018bd39" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 16
incremental = true
